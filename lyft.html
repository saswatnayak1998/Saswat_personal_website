<!DOCTYPE html>
<html lang="en">
    
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="./assets/profile-pic.ico" type="image/x-icon">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot-Sash</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="mediaqueries.css" />
</head>

<body>


    <nav id="desktop-nav">
        <div class="logo"></div>
    </nav>
    <div>
        

        <div id="ask_me" class="ask_me__section__text">
            <main class="content-wrapper">
                <h1>Click to get the Dashboard</h1>
            <main>
                <button class="btn btn-color-3 project-btn1" onclick="window.open('./assets/Lyft_Dashboard.pdf')">Dashboard</button>
                <button class="btn btn-color-2 project-btn" onclick="location.href='https://github.com/saswatnayak1998/lyft_DE'">Github</button>
            <div id="loading" style="display: none;"></div>
            <div id="answer-container"></div>
     
            <h1>About the <b class="highlight">Architecture</b>&#128200;</h1>
    

            <div class="section__pic-container">
                <img src="./assets/architecture_lyft.jpeg" />
              </div>
        </div>

    </div>
    
  <main class="content-wrapper">


  </main>
  <script>
    document.getElementById('ask-form').addEventListener('submit', function(event) {
        event.preventDefault(); // Prevent the default form submission
    
        // Show the loading indicator
        document.getElementById('loading').style.display = 'block';
        document.getElementById('answer-container').innerText = ''; // Clear previous answer
    
        const formData = new FormData(event.target);
        const question = formData.get('question'); // Get the question from the form
    
        fetch('https://sknayak-b22d4000-757a-4ff4-8914-b04cea705eee.socketxp.com/news', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json', // Indicate that we're sending JSON data
            },
            body: JSON.stringify({ "question": question }), // Send the question as JSON
        })
        .then(response => response.json()) // Parse the response as JSON
        .then(data => {
            // Hide the loading indicator
            document.getElementById('loading').style.display = 'none';
            
            // Display the response
            document.getElementById('answer-container').innerText = data.answer;
        })
        .catch(error => {
            console.error('Error:', error);
            // Hide the loading indicator and show error message if needed
            document.getElementById('loading').style.display = 'none';
            document.getElementById('answer-container').innerText = 'Failed to get a response.';
        });
    });
    </script>
    
    
    
</body>
</html>
